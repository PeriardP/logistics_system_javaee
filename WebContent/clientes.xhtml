<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:p="http://primefaces.org/ui">

<h:head>
    <title>Gerenciar Clientes</title>
</h:head>

<h:body>
    <h:form id="formCliente">
       
        <p:messages id="mensagens" autoUpdate="true" />

        <h:panelGrid columns="2">
            
            <p:outputLabel value="Nome:" />
            <p:inputText value="#{clienteBean.cliente.nome}" 
                         required="true" requiredMessage="O Nome é obrigatório!" />

            <p:outputLabel value="CPF:" />
            
            <p:inputMask mask="999.999.999-99" 
                         value="#{clienteBean.cliente.cpf}" 
                         disabled="#{clienteBean.edicao}" 
                         required="true" requiredMessage="O CPF é obrigatório!" />

            <p:outputLabel value="Celular:" />
            
            <p:inputMask mask="(99) 99999-9999" 
                         value="#{clienteBean.cliente.celular}" 
                         required="true" requiredMessage="O Celular é obrigatório!" />

           
            <p:outputLabel value="Rua:" />
            <p:inputText value="#{clienteBean.cliente.endereco.rua}" 
                         required="true" requiredMessage="A Rua é obrigatória!" />

            <p:outputLabel value="Número:" />
            <p:inputText value="#{clienteBean.cliente.endereco.numero}" 
                         required="true" requiredMessage="O Número é obrigatório!" />

            <p:outputLabel value="Bairro:" />
            <p:inputText value="#{clienteBean.cliente.endereco.bairro}" 
                         required="true" requiredMessage="O Bairro é obrigatório!" />

            <p:outputLabel value="Cidade:" />
            <p:inputText value="#{clienteBean.cliente.endereco.cidade}" 
                         required="true" requiredMessage="A Cidade é obrigatória!" />

        </h:panelGrid>

        <br/>
        
 
        <p:commandButton value="Salvar" action="#{clienteBean.salvar}" update="@form" />
        <p:commandButton value="Novo/Limpar" action="#{clienteBean.novo}" immediate="true" update="@form" />
        
        <br/><br/>
        
        
        <h:panelGrid columns="3">
            <p:outputLabel value="Pesquisar por Nome:" />
            <p:inputText value="#{clienteBean.texto}" />
            <p:commandButton value="Buscar" action="#{clienteBean.pesquisarCliente}" update="tabelaClientes" />
        </h:panelGrid>

        <br/>

    
        <p:dataTable id="tabelaClientes" value="#{clienteBean.clientes}" var="c" emptyMessage="Nenhum cliente encontrado.">
            
            <p:column headerText="Nome">
                <h:outputText value="#{c.nome}" />
            </p:column>
            
            <p:column headerText="CPF">
                <h:outputText value="#{c.cpf}" />
            </p:column>
            
            <p:column headerText="Celular">
                <h:outputText value="#{c.celular}" />
            </p:column>

            <p:column headerText="Cidade">
                <h:outputText value="#{c.endereco.cidade}" />
            </p:column>
            
            <p:column headerText="Ações">
                <p:commandButton value="Editar" action="#{clienteBean.editar(c)}" update="@form" />
                <p:commandButton value="Excluir" action="#{clienteBean.excluir(c)}" update="@form" />
            </p:column>
            
        </p:dataTable>
        
    </h:form>
</h:body>
</html>
